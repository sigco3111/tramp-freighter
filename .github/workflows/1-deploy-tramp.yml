name: deploy
on:
  push:
    branches: [main]
    paths: ['*payload.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: apply payload
        run: |
          zip=$(ls *payload.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$zip" ]; then
            unzip -o "$zip" -d .
            rm -f *payload.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "한글화 적용" || true
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /tramp-freighter/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: d
        uses: actions/deploy-pages@v4
